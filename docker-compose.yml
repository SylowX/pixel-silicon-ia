services:
  pixel-agents:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Path inside the container where Claude Code session files are read from.
      # Default: /dot-claude/projects/-root (Claude Code running from home directory ~/)
      # If you run Claude Code from a different directory, e.g. /home/user/myproject,
      # change this to: /dot-claude/projects/-home-user-myproject
      - CLAUDE_JSONL_DIR=/dot-claude/projects/-root
    volumes:
      # Mount your ~/.claude directory read-only into the container
      - ~/.claude:/dot-claude:ro
    restart: unless-stopped
